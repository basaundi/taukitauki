AutoName: TaukiTauki
Description: |-
  Basque flick-input keyboard for Android. Each key supports eight flick
  directions for fast syllable entry. Includes word suggestions, bigram
  predictions, emoji lookup, and a QWERTY fallback layout.

  The keyboard is fully offline — no network access, no telemetry.

